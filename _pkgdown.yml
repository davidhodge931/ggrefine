url: ~
template:
  bootstrap: 5
  light-switch: yes
reference:
- title: theme
- contents:
  - theme_lights
  - theme_greys
  - theme_darks
- title: refine
- contents:
  - contains("classic")
  - contains("minimal")
  - contains("modern")
  - contains("void")
  - refine_legend
- title: scale
- contents:
  - contains("blend")
  - contains("contrast")
- title: other
- contents:
  - ggrefine
  - contains("update")

