url: ~
template:
  bootstrap: 5
  light-switch: yes
reference:
- title: theme
- contents:
  - theme_lighter
  - theme_greyer
  - theme_darker
  - theme_ggplot2
- title: refine
- contents:
  - contains("classic")
  - contains("minimal")
  - contains("modern")
  - contains("void")
  - refine_legend
- title: scale
- contents:
  - contains("blend")
  - contains("contrast")

