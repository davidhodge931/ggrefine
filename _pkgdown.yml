url: ~
template:
  bootstrap: 5
  light-switch: yes
reference:
- title: theme
- contents:
  - starts_with("theme_")
  - update_greys
  - update_lights
  - update_darks
- title: refine
- contents:
  - contains("refine_")
- title: Aesthetics
- contents:
  - starts_with("aes_")
- title: Scales
- contents:
  - starts_with("scale_")
- title: other
- contents:
  - ggrefine
  - contains("update")

