url: ~
template:
  bootstrap: 5
  light-switch: yes
reference:
- title: theme
- contents:
  - theme_lights
  - theme_greys
  - theme_darks
- title: refine
- contents:
  - contains("refine_")
- title: scale
- contents:
  - contains("blend")
  - contains("contrast")
- title: other
- contents:
  - ggrefine
  - contains("update")

