url: ~
template:
  bootstrap: 5
  light-switch: yes
reference:
- title: Theme
- contents:
  - theme_greys
  - theme_lights
  - theme_darks
- title: Refine
- contents:
  - contains("refine_")
- title: Aesthetic
- contents:
  - starts_with("aes_")
- title: Scale
- contents:
  - starts_with("scale_")
- title: Update
- contents:
  - update_greys
  - update_lights
  - update_darks
  - update_palette
  - update_panel_size
- title: other
- contents:
  - ggrefine

